[package]
name = "mailstudio-core"
description = "Mail accounts, IMAP/SMTP sync and local storage behind MailStudio (UI-agnostic)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
ammonia = "4.2"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64.workspace = true
dirs.workspace = true
futures = "0.3"
hickory-resolver = "0.26.3"
keyring.workspace = true
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
mail-parser = "0.11.9"
reqwest.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
uuid = { version = "1.29", features = ["v4"] }
webpki-roots = "1.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
